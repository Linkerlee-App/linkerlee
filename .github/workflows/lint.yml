name: linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          npm install

      # Wayfinder output is gitignored, but ~20 components import from @/actions and
      # @/routes. Without generating it first, tsc cannot resolve those imports.
      # --with-form matches `formVariants: true` in vite.config.ts; without it the
      # .form() helpers the auth pages use are missing.
      - name: Generate Wayfinder routes
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Check PHP formatting
        run: composer test:lint

      - name: Check types
        run: npm run types

      - name: Lint frontend
        run: npm run lint:check

      - name: Check frontend formatting
        run: npm run format:check
