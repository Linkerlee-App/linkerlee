; LinkerLee production overrides, layered on top of php.ini-production.

; Docker passes configuration as environment variables; make sure PHP exposes
; them in $_ENV as well as $_SERVER so Laravel's env() sees them either way.
variables_order = "EGPCS"

expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Bookmark exports from a long-lived browser profile are large HTML files.
upload_max_filesize = 32M
post_max_size = 40M

; The application code never changes inside a built image, so opcache does not
; need to stat files on every request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Log to the container's stderr, where `docker compose logs` picks it up.
error_log = /proc/self/fd/2
