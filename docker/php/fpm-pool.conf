[www]
; php-fpm scrubs the environment by default, which would hide every variable
; docker-compose passes in from Laravel. This is the single most important
; line in this file.
clear_env = no

; Worker output goes to the container log rather than a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Used by the container healthcheck (see docker-compose.yml).
ping.path = /ping
pm.status_path = /status

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
